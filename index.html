<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory PT Shabar Tour</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide { display: none !important; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col overflow-hidden">

    <div id="modal-backdrop" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hide flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 animate-fade-in">
            <h3 id="modal-title" class="text-lg font-bold text-gray-900 mb-2">Title</h3>
            <div id="modal-body" class="text-sm text-gray-600 mb-6">Body content goes here...</div>
            <div id="modal-actions" class="flex justify-end space-x-3"></div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <div id="login-screen" class="absolute inset-0 z-40 bg-emerald-900 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4 overflow-hidden border border-emerald-200">
                <img src="logo.png" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/065f46/ffffff?text=ST'">
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-1">PT Shabar Tour</h1>
            <p class="text-sm text-gray-500 mb-6">Sistem Manajemen Inventaris</p>
            
            <form onsubmit="app.handleAuthSubmit(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Email Pengguna</label>
                    <input type="email" id="login-email" required placeholder="admin@shabartour.com" class="w-full border rounded-lg p-2.5 text-sm focus:ring-1 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Kata Sandi</label>
                    <input type="password" id="login-pass" required placeholder="••••••••" class="w-full border rounded-lg p-2.5 text-sm focus:ring-1 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Akses Peran (Role)</label>
                    <select id="login-role" class="w-full border rounded-lg p-2.5 text-sm focus:ring-1 focus:ring-emerald-500 outline-none bg-white">
                        <option value="admin">Administrator (Akses Penuh)</option>
                        <option value="staf">Staf Lapangan / Gudang</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium transition-colors flex items-center justify-center gap-2 shadow-md mt-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Sistem
                </button>
            </form>
        </div>
    </div>

    <div id="main-layout" class="hide h-full flex flex-col md:flex-row w-full">
        <nav class="bg-emerald-800 text-white w-full md:w-64 flex-shrink-0 flex md:flex-col justify-between md:justify-start order-last md:order-first border-t md:border-t-0 border-emerald-900 z-20">
            <div class="hidden md:block p-6 border-b border-emerald-700/50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-white p-1 flex items-center justify-center overflow-hidden shadow">
                        <img src="logo.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/100x100/065f46/ffffff?text=ST'">
                    </div>
                    <div>
                        <h2 class="font-bold text-lg leading-tight">Shabar Tour</h2>
                        <p class="text-emerald-300 text-xs" id="user-role-display">Role</p>
                    </div>
                </div>
            </div>
            
            <div class="flex md:flex-col w-full md:w-auto p-2 md:p-4 gap-1 md:gap-2">
                <button onclick="app.navigate('dashboard')" class="nav-btn active flex-1 md:flex-none flex flex-col md:flex-row items-center md:justify-start gap-1 md:gap-3 p-2 md:p-3 rounded-lg hover:bg-emerald-700 transition-colors text-xs md:text-sm">
                    <i class="fa-solid fa-chart-pie text-lg md:text-base"></i> <span class="block">Dashboard</span>
                </button>
                <button onclick="app.navigate('items')" class="nav-btn flex-1 md:flex-none flex flex-col md:flex-row items-center md:justify-start gap-1 md:gap-3 p-2 md:p-3 rounded-lg hover:bg-emerald-700 transition-colors text-xs md:text-sm">
                    <i class="fa-solid fa-box-open text-lg md:text-base"></i> <span class="block">Barang</span>
                </button>
                <button onclick="app.navigate('scan')" class="nav-btn flex-1 md:flex-none flex flex-col md:flex-row items-center md:justify-start gap-1 md:gap-3 p-2 md:p-3 rounded-lg bg-emerald-600 hover:bg-emerald-500 shadow-lg transition-colors text-xs md:text-sm">
                    <i class="fa-solid fa-qrcode text-lg md:text-base"></i> <span class="block font-semibold">Scan QR</span>
                </button>
                <button onclick="app.navigate('history')" class="nav-btn flex-1 md:flex-none flex flex-col md:flex-row items-center md:justify-start gap-1 md:gap-3 p-2 md:p-3 rounded-lg hover:bg-emerald-700 transition-colors text-xs md:text-sm">
                    <i class="fa-solid fa-clock-rotate-left text-lg md:text-base"></i> <span class="block">Riwayat</span>
                </button>
                <button onclick="app.logout()" class="hidden md:flex flex-1 md:flex-none flex-col md:flex-row items-center md:justify-start gap-1 md:gap-3 p-2 md:p-3 rounded-lg hover:bg-red-600 transition-colors text-xs md:text-sm mt-auto text-emerald-200 hover:text-white">
                    <i class="fa-solid fa-right-from-bracket text-lg md:text-base"></i> <span class="block">Keluar</span>
                </button>
            </div>
        </nav>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 md:p-8 relative">
            <div id="view-dashboard" class="view-section animate-fade-in">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Ringkasan Inventaris</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xl"><i class="fa-solid fa-boxes-stacked"></i></div>
                        <div><p class="text-sm text-gray-500">Total Jenis Barang</p><p class="text-2xl font-bold text-gray-800" id="stat-total-items">0</p></div>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl"><i class="fa-solid fa-arrow-right-to-bracket"></i></div>
                        <div><p class="text-sm text-gray-500">Transaksi Masuk</p><p class="text-2xl font-bold text-gray-800" id="stat-in">0</p></div>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-xl"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
                        <div><p class="text-sm text-gray-500">Transaksi Keluar</p><p class="text-2xl font-bold text-gray-800" id="stat-out">0</p></div>
                    </div>
                </div>
            </div>
            <!-- Bagian View Lainnya tetap dipertahankan -->
        </main>
    </div>
</body>
</html>
